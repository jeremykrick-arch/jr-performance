<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JR Performance</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JR Performance"><meta name="theme-color" content="#101a2b"><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#eef4ff;background:#0c1423}*{box-sizing:border-box}body{margin:0;padding-bottom:82px}header{padding:24px 18px 12px;background:linear-gradient(130deg,#172e4b,#0c1423)}h1{margin:0;font-size:26px}h2{font-size:19px;margin:12px 0}h3{margin:12px 0 7px;font-size:16px}p,.muted{color:#b2c2d7}.tag{display:inline-block;background:#243d5b;border-radius:20px;padding:5px 10px;color:#b7e2ff;font-size:12px}.wrap{padding:14px;max-width:850px;margin:auto}.card{background:#16243a;border:1px solid #30445d;border-radius:15px;padding:15px;margin-bottom:12px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{font-size:24px;font-weight:800;color:#76dbbd}button,select,input,textarea{font:inherit}button{background:#45c9a4;color:#08221b;border:0;border-radius:10px;padding:10px 13px;font-weight:750;cursor:pointer}button.secondary{background:#29425d;color:#edf4ff}button.danger{background:#743b4a;color:white}input,select,textarea{background:#0e1a2c;border:1px solid #415772;color:white;border-radius:9px;padding:9px;min-width:0}input[type=number]{width:78px}input[type=date]{max-width:155px}textarea{width:100%;min-height:65px}.sets{display:grid;grid-template-columns:35px 1fr 1fr 52px;gap:6px;align-items:center;margin:8px 0}.sets label{font-size:11px;color:#a8bbcf}.sets input{width:100%}.exercise{border-top:1px solid #30445d;padding:13px 0}.exercise:first-child{border-top:0}nav{position:fixed;bottom:0;left:0;right:0;background:#101d31;border-top:1px solid #39506a;display:flex;justify-content:space-around;padding:9px 3px max(10px,env(safe-area-inset-bottom));z-index:4}nav button{font-size:12px;padding:9px 7px;background:none;color:#b6c9e2}nav button.active{color:#62e2bb;background:#223d53}.hidden{display:none}small{color:#b4c5da}.pill{border-radius:8px;background:#20354e;padding:7px}.bar{height:10px;border-radius:10px;background:#2e4159;overflow:hidden}.bar>div{height:100%;background:#47cfa7}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px;border-bottom:1px solid #34475e;text-align:left}canvas{width:100%;height:190px}.warn{background:#3c3325;padding:10px;border-radius:10px;color:#f4dfb3}a{color:#78ddff}
</style></head><body><header><span class="tag">BASEBALL PERFORMANCE • 12 WEEKS</span><h1>JR PERFORMANCE</h1><p style="margin:6px 0">Train smart. Get stronger. Track progress.</p></header>
<div class="wrap">
<section id="dashboard"></section><section id="workouts" class="hidden"></section><section id="progress" class="hidden"></section><section id="library" class="hidden"></section><section id="settings" class="hidden"></section>
</div><nav id="nav"></nav>
<script>
const days=['Monday','Thursday','Saturday'];
const exercises={
Monday:[
['Dynamic warm-up','Warm-up',1,10,'minutes','Jog, A-skips, high knees, lunges, lateral shuffles and leg swings.'],
['10-yard acceleration sprint','Speed',4,1,'reps','Full recovery; accelerate with strong forward lean.'],
['20-yard sprint','Speed',3,1,'reps','Full recovery between efforts.'],
['Broad jump','Power',3,3,'reps','Stick each landing softly.'],
['Lateral bound','Power',2,5,'per side','Control the landing on one leg.'],
['Barbell back squat','Strength',3,8,'reps','Brace, squat to controlled depth; no grinding.'],
['Trap bar deadlift','Strength',3,6,'reps','Push through floor, keep spine neutral. Alternate lighter emphasis with squats.'],
['Dumbbell reverse lunge','Strength',3,8,'per leg','Step backward and maintain balance.'],
['Romanian deadlift','Strength',2,10,'reps','Hinge at hips, keep weights close.'],
['Standing calf raise','Strength',2,15,'reps','Full controlled range.'],
['Plank','Core',3,30,'seconds','Brace abdomen and maintain straight line.']],
Thursday:[
['Dynamic warm-up','Warm-up',1,10,'minutes','Light cardio, band pull-aparts, external rotations and thoracic mobility.'],
['Lateral shuffle','Movement',3,10,'yards','Smooth, low-intensity movement.'],
['Single-leg balance reach','Movement',2,6,'per leg','Stay balanced and controlled.'],
['Barbell strict press','Strength',2,8,'reps','Light/moderate, no back arch; skip if arm sore.'],
['Assisted pull-up','Strength',3,8,'reps','Control full range.'],
['Dumbbell bench press','Strength',2,8,'reps','Stop short of fatigue before hitting.'],
['Single-arm cable row','Strength',2,10,'per side','Keep torso steady.'],
['Face pull','Shoulder',2,12,'reps','Pull toward face with elbows high, light weight.'],
['Pallof press','Core',2,10,'per side','Resist torso rotation.'],
['Dead bug','Core',2,10,'per side','Keep lower back supported.']],
Saturday:[
['Dynamic warm-up','Warm-up',1,10,'minutes','Jog, A-skips, lunges, shuffles and mobility.'],
['5-10-5 shuttle','Agility',3,1,'reps','Plant under control and accelerate out.'],
['10-yard reaction sprint','Speed',4,1,'reps','React to visual or verbal cue.'],
['Low box jump','Power',3,3,'reps','Use a low box and step down.'],
['Medicine ball rotational throw','Power',3,5,'per side','Rotate through hips, avoid overloading throwing arm.'],
['Barbell front squat','Strength',3,8,'reps','Keep elbows high and torso tall.'],
['Dumbbell Romanian deadlift','Strength',3,8,'reps','Controlled hip hinge.'],
['Push-up','Strength',3,10,'reps','Maintain rigid trunk.'],
['Seated cable row','Strength',3,10,'reps','Shoulders down, control return.'],
['Farmer carry','Strength',3,25,'yards','Walk tall and keep trunk braced.'],
['Side plank','Core',3,30,'seconds per side','Hips stacked, body aligned.']]};
const tests=[['10-yard sprint','sec','lower'],['20-yard sprint','sec','lower'],['5-10-5 shuttle','sec','lower'],['Vertical jump','in','higher'],['Broad jump','in','higher'],['Push-ups','reps','higher'],['Body weight','lb','neutral']];
const key='jr-performance-v1';
let db={sessions:{},tests:{},start:'',notes:{}};
try{db={...db,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){}
const save=()=>localStorage.setItem(key,JSON.stringify(db));
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let week=1,day='Monday',tab='dashboard';
const phase=w=>w===4||w===8||w===12?'Recovery / assessment':w<=3?'Foundation':w<=7?'Development':'Strength & power';
function target(w,e){let n=e[2],r=e[3];if(e[1]==='Strength'&&['Barbell back squat','Barbell front squat','Barbell strict press'].includes(e[0])){if(w===4)return [2,8];if(w===8)return [2,6];if(w===12)return [2,5];if(w>=9)return [e[0]==='Barbell strict press'?3:3,e[0]==='Barbell back squat'?5:6];if(w>=5)return [e[0]==='Barbell strict press'?2:3,6]}if([4,8,12].includes(w)&&!['Warm-up'].includes(e[1]))n=Math.max(1,Math.ceil(n*.65));return [n,r]}
const sid=(w,d)=>`${w}-${d}`;
const session=(w,d)=>db.sessions[sid(w,d)]||{};
const allDone=(w,d)=>session(w,d).finished===true;
function navigate(t){tab=t;for(const s of ['dashboard','workouts','progress','library','settings'])$(s).classList.toggle('hidden',s!==t);$('nav').innerHTML=['dashboard','workouts','progress','library','settings'].map((s,i)=>`<button class="${s===t?'active':''}" onclick="navigate('${s}')">${['⌂ Home','▤ Workouts','↗ Progress','☷ Library','⚙ Data'][i]}</button>`).join('');render();scrollTo(0,0)}
function render(){({dashboard:renderDashboard,workouts:renderWorkout,progress:renderProgress,library:renderLibrary,settings:renderSettings})[tab]()}
function renderDashboard(){let done=Object.values(db.sessions).filter(s=>s.finished).length;let pct=Math.round(done/36*100);
$('dashboard').innerHTML=`<div class="card"><div class="row"><div><small>12-WEEK TRAINING BLOCK</small><h2>${done} / 36 workouts complete</h2></div><div class="stat">${pct}%</div></div><div class="bar"><div style="width:${pct}%"></div></div><p>Monday: lower body • Thursday: upper body (before hitting) • Saturday: total body</p></div><div class="grid"><div class="card"><small>Current selected week</small><div class="stat">${week}</div><small>${phase(week)}</small></div><div class="card"><small>Completed sessions</small><div class="stat">${done}</div><small>of 36 scheduled</small></div></div><div class="card"><h2>Open a workout</h2><label>Week <select onchange="week=+this.value;render()">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${week===i+1?'selected':''}>Week ${i+1}</option>`).join('')}</select></label>${days.map(d=>`<div class="row" style="margin-top:12px"><span>${allDone(week,d)?'✅':'○'} <b>${d}</b><br><small>${d==='Monday'?'Lower body + acceleration':d==='Thursday'?'Upper body + stability':'Total body + agility'}</small></span><button onclick="day='${d}';navigate('workouts')">Open →</button></div>`).join('')}</div><div class="card warn">JR has pitching Tuesday, practice Wednesday/Sunday, and hitting Thursday evening. Keep Thursday lighter; reduce lifting or throwing drills if sore. Pain is a stop signal.</div>`}
function prevInfo(w,d,name){for(let i=w-1;i>=1;i--){let v=session(i,d).items?.[name]?.sets||[];let used=v.filter(x=>x.weight!==''&&x.weight!=null&&x.reps);if(used.length)return `Last: ${used.map(x=>`${x.weight} lb × ${x.reps}`).join(', ')}`}return 'No previous entry'}
function renderWorkout(){let s=session(week,day),list=exercises[day];$('workouts').innerHTML=`<div class="card"><div class="row"><label>Week <select onchange="week=+this.value;render()">${Array.from({length:12},(_,i)=>`<option ${week===i+1?'selected':''} value="${i+1}">${i+1}</option>`).join('')}</select></label><label>Day <select onchange="day=this.value;render()">${days.map(d=>`<option ${day===d?'selected':''}>${d}</option>`).join('')}</select></label></div><h2>${day} • ${phase(week)}</h2><label>Workout date <input type="date" value="${esc(s.date||'')}" onchange="setSession('date',this.value)"></label><p><small>Record each set. For sprints, jumps, and timed holds, use the reps field for the result and leave weight blank. Check each set when completed.</small></p></div>${list.map((e,i)=>{let [n,r]=target(week,e),saved=s.items?.[e[0]]||{};return `<div class="card"><div class="row"><div><span class="tag">${e[1]}</span><h3>${esc(e[0])}</h3></div><small>${n} × ${r} ${e[4]}</small></div><small>${esc(e[5])}</small><p style="margin:7px 0"><small>${esc(prevInfo(week,day,e[0]))}</small></p><div class="sets"><label>Set</label><label>Weight (lb)</label><label>Reps/result</label><label>Done</label>${Array.from({length:n},(_,j)=>{let a=saved.sets?.[j]||{};return `<span>${j+1}</span><input type="number" min="0" step="any" placeholder="—" value="${esc(a.weight??'')}" oninput="updateSet(${i},${j},'weight',this.value)"><input type="number" min="0" step="any" placeholder="${r}" value="${esc(a.reps??'')}" oninput="updateSet(${i},${j},'reps',this.value)"><input type="checkbox" ${a.done?'checked':''} onchange="updateSet(${i},${j},'done',this.checked)">`}).join('')}</div></div>`}).join('')}<div class="card"><h3>Recovery & session notes</h3><div class="row"><label>Energy (1–5)<br><select onchange="setSession('energy',this.value)"><option value="">Choose</option>${[1,2,3,4,5].map(v=>`<option ${String(s.energy)===String(v)?'selected':''}>${v}</option>`).join('')}</select></label><label>Soreness (0–5)<br><select onchange="setSession('soreness',this.value)"><option value="">Choose</option>${[0,1,2,3,4,5].map(v=>`<option ${String(s.soreness)===String(v)?'selected':''}>${v}</option>`).join('')}</select></label></div><p><textarea placeholder="How did it feel? Any soreness, baseball workload, or changes?" oninput="setSession('note',this.value)">${esc(s.note||'')}</textarea></p><button onclick="finish()" class="${s.finished?'secondary':''}">${s.finished?'✓ Workout marked complete (tap to undo)':'✓ Mark workout complete'}</button></div>`}
function setSession(k,v){let id=sid(week,day);db.sessions[id]??={};db.sessions[id][k]=v;save()}
function updateSet(i,j,k,v){let id=sid(week,day),name=exercises[day][i][0];db.sessions[id]??={};db.sessions[id].items??={};db.sessions[id].items[name]??={sets:[]};let a=db.sessions[id].items[name].sets;a[j]??={};a[j][k]=k==='done'?v:v===''?'':Number(v);save()}
function finish(){setSession('finished',!session(week,day).finished);render()}
function renderProgress(){let html=`<div class="card"><h2>Performance testing</h2><p>Enter results in weeks 1, 6, and 12. Lower times are better for sprints; higher distances are better for jumps.</p><div class="scroll"><table><tr><th>Test</th><th>Week 1</th><th>Week 6</th><th>Week 12</th></tr>${tests.map(t=>`<tr><td>${t[0]}<br><small>${t[1]}</small></td>${[1,6,12].map(w=>`<td><input style="width:75px" type="number" step="any" min="0" value="${esc(db.tests[t[0]]?.[w]??'')}" oninput="setTest('${t[0]}',${w},this.value)"></td>`).join('')}</tr>`).join('')}</table></div></div><div class="card"><h2>Strength trends</h2><label>Lift <select id="liftSelect" onchange="drawChart()">${['Barbell back squat','Barbell front squat','Barbell strict press','Trap bar deadlift'].map(x=>`<option>${x}</option>`).join('')}</select></label><canvas id="chart" width="700" height="280"></canvas><small>Chart shows highest logged weight per week for the selected lift.</small></div><div class="card"><h2>Workout completion</h2>${Array.from({length:12},(_,i)=>{let count=days.filter(d=>allDone(i+1,d)).length;return `<div class="row" style="margin:8px 0"><span>Week ${i+1}</span><span>${count}/3</span></div><div class="bar"><div style="width:${count/3*100}%"></div></div>`}).join('')}</div>`;$('progress').innerHTML=html;drawChart()}
function setTest(t,w,v){db.tests[t]??={};db.tests[t][w]=v===''?'':Number(v);save()}
function drawChart(){let c=$('chart');if(!c)return;let x=c.getContext('2d'),name=$('liftSelect').value;let pts=[];for(let w=1;w<=12;w++){let a=days.flatMap(d=>session(w,d).items?.[name]?.sets||[]).map(v=>Number(v.weight)).filter(v=>v>0);pts.push(a.length?Math.max(...a):null)}x.clearRect(0,0,700,280);x.fillStyle='#a8bed8';x.font='17px system-ui';x.fillText('Highest weight (lb)',35,28);x.strokeStyle='#4d657e';x.beginPath();x.moveTo(45,45);x.lineTo(45,230);x.lineTo(670,230);x.stroke();let vals=pts.filter(v=>v!==null),max=Math.max(10,...vals)*1.15;x.strokeStyle='#54d9b5';x.lineWidth=4;x.beginPath();let started=false;pts.forEach((v,i)=>{let px=55+i*54,py=230-(v/max)*170;x.fillStyle='#a7bdd6';x.fillText(i+1,px-4,251);if(v!==null){if(!started){x.moveTo(px,py);started=true}else x.lineTo(px,py)}else started=false});x.stroke();pts.forEach((v,i)=>{if(v!==null){let px=55+i*54,py=230-(v/max)*170;x.beginPath();x.arc(px,py,5,0,7);x.fillStyle='#54d9b5';x.fill();x.fillStyle='#fff';x.font='13px system-ui';x.fillText(v,px-8,py-12)}});if(!vals.length){x.fillStyle='#a8bed8';x.fillText('Log weights in workouts to see your trend.',75,135)}}
function renderLibrary(){let unique=new Map();days.forEach(d=>exercises[d].forEach(e=>unique.set(e[0],e)));$('library').innerHTML=`<div class="card"><h2>Exercise library</h2><p>Coaching cues for every movement in the program. Ask a qualified coach to check technique and supervise loaded lifts.</p></div>${[...unique.values()].map(e=>`<details class="card"><summary><b>${esc(e[0])}</b> <span class="tag">${e[1]}</span></summary><p>${esc(e[5])}</p><small>Base prescription: ${e[2]} sets × ${e[3]} ${e[4]}; follow weekly targets in the workout tab.</small></details>`).join('')}`}
function renderSettings(){$('settings').innerHTML=`<div class="card"><h2>Backup & restore</h2><p>Workout data is saved only in this browser on this device. Clearing browser data or changing phones may erase it. Export a backup regularly.</p><div class="row"><button onclick="exportJSON()">Export backup (.json)</button><button class="secondary" onclick="exportCSV()">Export sets (.csv)</button></div><p><label>Restore backup <input type="file" accept=".json,application/json" onchange="importJSON(event)"></label></p></div><div class="card"><h2>Program schedule</h2><p>Monday gym • Tuesday pitching • Wednesday practice • Thursday gym before evening hitting • Friday recovery • Saturday gym • Sunday practice.</p><p class="warn">For a developing athlete: maintain technique, avoid max testing, keep 2–3 reps in reserve, and adjust volume for throwing workload. Stop for pain and consult an appropriate clinician for persistent symptoms.</p></div><div class="card"><h2>Reset</h2><p>Only use this if you want to delete all saved workout history on this device.</p><button class="danger" onclick="if(confirm('Delete ALL saved data? This cannot be undone.')){localStorage.removeItem(key);location.reload()}">Erase all data</button></div>`}
function exportJSON(){download('JR_Performance_Backup.json',JSON.stringify(db,null,2),'application/json')}
function exportCSV(){let lines=[['Week','Day','Exercise','Set','Weight lb','Reps/result','Completed','Workout complete','Date']];for(let w=1;w<=12;w++)for(let d of days){let s=session(w,d);for(let e of exercises[d]){let sets=s.items?.[e[0]]?.sets||[];sets.forEach((v,i)=>lines.push([w,d,e[0],i+1,v.weight??'',v.reps??'',v.done?'Yes':'No',s.finished?'Yes':'No',s.date||'']))}}download('JR_Performance_Workout_Log.csv',lines.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
function download(name,data,type){let url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
async function importJSON(ev){let f=ev.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x.sessions||!x.tests)throw Error('Not a JR backup');if(confirm('Replace current data with this backup?')){db=x;save();render();alert('Backup restored')}}catch(e){alert('Could not restore: '+e.message)}}
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
navigate('dashboard');
</script></body></html>
