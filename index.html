<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JR Performance</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JR Performance"><meta name="theme-color" content="#101a2b"><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#eef4ff;background:#0c1423}*{box-sizing:border-box}body{margin:0;padding-bottom:82px}header{padding:24px 18px 12px;background:linear-gradient(130deg,#172e4b,#0c1423)}h1{margin:0;font-size:26px}h2{font-size:19px;margin:12px 0}h3{margin:12px 0 7px;font-size:16px}p,.muted{color:#b2c2d7}.tag{display:inline-block;background:#243d5b;border-radius:20px;padding:5px 10px;color:#b7e2ff;font-size:12px}.wrap{padding:14px;max-width:850px;margin:auto}.card{background:#16243a;border:1px solid #30445d;border-radius:15px;padding:15px;margin-bottom:12px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{font-size:24px;font-weight:800;color:#76dbbd}button,select,input,textarea{font:inherit}button{background:#45c9a4;color:#08221b;border:0;border-radius:10px;padding:10px 13px;font-weight:750;cursor:pointer}button.secondary{background:#29425d;color:#edf4ff}button.danger{background:#743b4a;color:white}input,select,textarea{background:#0e1a2c;border:1px solid #415772;color:white;border-radius:9px;padding:9px;min-width:0}input[type=number]{width:78px}input[type=date]{max-width:155px}textarea{width:100%;min-height:65px}.sets{display:grid;grid-template-columns:35px 1fr 1fr 52px;gap:6px;align-items:center;margin:8px 0}.sets label{font-size:11px;color:#a8bbcf}.sets input{width:100%}.exercise{border-top:1px solid #30445d;padding:13px 0}.exercise:first-child{border-top:0}nav{position:fixed;bottom:0;left:0;right:0;background:#101d31;border-top:1px solid #39506a;display:flex;justify-content:space-around;padding:9px 3px max(10px,env(safe-area-inset-bottom));z-index:4}nav button{font-size:12px;padding:9px 7px;background:none;color:#b6c9e2}nav button.active{color:#62e2bb;background:#223d53}.hidden{display:none}small{color:#b4c5da}.pill{border-radius:8px;background:#20354e;padding:7px}.bar{height:10px;border-radius:10px;background:#2e4159;overflow:hidden}.bar>div{height:100%;background:#47cfa7}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px;border-bottom:1px solid #34475e;text-align:left}canvas{width:100%;height:190px}.warn{background:#3c3325;padding:10px;border-radius:10px;color:#f4dfb3}a{color:#78ddff}

:root{--mint:#5ee0b6;--ink:#091323;--panel:#16263e;--border:#304762}body{background:radial-gradient(circle at 95% 0%,#193653 0%,#0b1525 35%);font-size:15px}header{padding:27px 19px 21px;border-bottom:1px solid #2c4965}header h1{letter-spacing:-1px;font-size:30px}.wrap{max-width:780px;padding:16px}.card{box-shadow:0 6px 20px #00000018;background:linear-gradient(150deg,#182a43,#132238);border-color:#324963;padding:17px;border-radius:18px}.hero{background:linear-gradient(130deg,#204b58,#14314b 60%,#18233d);border:1px solid #397b80}.hero h2{font-size:26px;line-height:1.1;margin:12px 0 8px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.4px;color:#9adfdb}.progressrow{display:flex;align-items:center;gap:10px;margin:12px 0}.progressrow .bar{flex:1}.mini{font-size:12px;color:#9eb6d1}.daycard{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #344d67;border-radius:13px;margin:9px 0;background:#14263c}.daycard strong{display:block;font-size:16px}.daycard .symbol{font-size:20px;width:35px;height:35px;display:grid;place-items:center;background:#263f58;border-radius:10px}.daycard button{margin-left:auto}.badge{background:#23463f;color:#91f2d2;padding:5px 9px;border-radius:99px;font-size:12px}.badge.pending{background:#2c3d53;color:#b6c9df}.exercise-head{display:flex;align-items:flex-start;gap:10px}.exercise-num{border-radius:12px;background:#28465c;color:#8fe7cf;font-weight:800;min-width:35px;height:35px;display:grid;place-items:center}.exercise-title{flex:1}.exercise-title h3{margin:0 0 5px}.exercise-card.done{border-color:#387964;background:#142f35}.sets{grid-template-columns:36px 1fr 1fr 48px;gap:9px}.sets input{font-size:16px;height:43px;text-align:center}.sets input[type=checkbox]{width:22px;height:22px;accent-color:#58dcb4;margin:auto}.sets label{text-align:center}.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 0 9px}.section-title h2{margin:0}.big-button{width:100%;padding:15px;font-size:16px}.light-button{background:#2a4860;color:#e5f4ff}.tabline{display:flex;gap:8px;margin:10px 0;overflow:auto}.tabline button{white-space:nowrap}.tabline .selected{background:#5ee0b6;color:#09261f}.subtle{background:#112136;border:1px solid #33475c;border-radius:12px;padding:11px;margin:12px 0}details.card summary{cursor:pointer}nav{backdrop-filter:blur(14px);background:#0e1c2ff0}nav button{font-size:12px;border-radius:10px;min-width:62px}button:active{transform:scale(.98)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #72e9c7;outline-offset:2px}input[type=date]{font-size:16px}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.wrap{padding:24px}}

#restDock{position:fixed;bottom:73px;right:12px;z-index:20;background:#19334a;border:1px solid #5b8091;border-radius:15px;padding:11px;box-shadow:0 6px 22px #0008;max-width:235px}#restDock strong{font-size:25px;color:#65e5b9}#restDock button{padding:7px 10px;margin:3px}.prbadge{display:inline-block;color:#1b281f;background:#f8cf64;border-radius:7px;padding:3px 7px;font-weight:800;font-size:12px}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#f5cf70;color:#182236;padding:13px 18px;border-radius:12px;z-index:99;box-shadow:0 5px 30px #0008;font-weight:800;max-width:92vw;text-align:center}
.smart-box{background:#122f3b;border:1px solid #2f8b8b;border-radius:12px;padding:11px;margin:11px 0}.smart-box b{color:#91ead3}.smart-box select{margin-top:7px;max-width:100%}</style></head><body><header><span class="tag">⚾ JR ATHLETIC DEVELOPMENT</span><h1>JR <span style="color:#5ee0b6">PERFORMANCE</span></h1><p style="margin:6px 0">Show up. Put in the work. Level up.</p></header>
<div class="wrap">
<section id="dashboard"></section><section id="workouts" class="hidden"></section><section id="progress" class="hidden"></section><section id="library" class="hidden"></section><section id="settings" class="hidden"></section>
</div><div id="restDock" class="hidden" aria-live="polite"></div><div id="toast" class="toast hidden" role="status"></div><nav id="nav"></nav>
<script>
const days=['Monday','Thursday','Saturday'];
const exercises={
Monday:[
['Dynamic warm-up','Warm-up',1,10,'minutes','Jog, A-skips, high knees, lunges, lateral shuffles and leg swings.'],
['10-yard acceleration sprint','Speed',4,1,'reps','Full recovery; accelerate with strong forward lean.'],
['20-yard sprint','Speed',3,1,'reps','Full recovery between efforts.'],
['Broad jump','Power',3,3,'reps','Stick each landing softly.'],
['Lateral bound','Power',2,5,'per side','Control the landing on one leg.'],
['Barbell back squat','Strength',3,8,'reps','Brace, squat to controlled depth; no grinding.'],
['Trap bar deadlift','Strength',3,6,'reps','Push through floor, keep spine neutral. Alternate lighter emphasis with squats.'],
['Dumbbell reverse lunge','Strength',3,8,'per leg','Step backward and maintain balance.'],
['Romanian deadlift','Strength',2,10,'reps','Hinge at hips, keep weights close.'],
['Standing calf raise','Strength',2,15,'reps','Full controlled range.'],
['Plank','Core',3,30,'seconds','Brace abdomen and maintain straight line.']],
Thursday:[
['Dynamic warm-up','Warm-up',1,10,'minutes','Light cardio, band pull-aparts, external rotations and thoracic mobility.'],
['Lateral shuffle','Movement',3,10,'yards','Smooth, low-intensity movement.'],
['Single-leg balance reach','Movement',2,6,'per leg','Stay balanced and controlled.'],
['Barbell strict press','Strength',2,8,'reps','Light/moderate, no back arch; skip if arm sore.'],
['Assisted pull-up','Strength',3,8,'reps','Control full range.'],
['Dumbbell bench press','Strength',2,8,'reps','Stop short of fatigue before hitting.'],
['Single-arm cable row','Strength',2,10,'per side','Keep torso steady.'],
['Face pull','Shoulder',2,12,'reps','Pull toward face with elbows high, light weight.'],
['Pallof press','Core',2,10,'per side','Resist torso rotation.'],
['Dead bug','Core',2,10,'per side','Keep lower back supported.']],
Saturday:[
['Dynamic warm-up','Warm-up',1,10,'minutes','Jog, A-skips, lunges, shuffles and mobility.'],
['5-10-5 shuttle','Agility',3,1,'reps','Plant under control and accelerate out.'],
['10-yard reaction sprint','Speed',4,1,'reps','React to visual or verbal cue.'],
['Low box jump','Power',3,3,'reps','Use a low box and step down.'],
['Medicine ball rotational throw','Power',3,5,'per side','Rotate through hips, avoid overloading throwing arm.'],
['Barbell front squat','Strength',3,8,'reps','Keep elbows high and torso tall.'],
['Dumbbell Romanian deadlift','Strength',3,8,'reps','Controlled hip hinge.'],
['Push-up','Strength',3,10,'reps','Maintain rigid trunk.'],
['Seated cable row','Strength',3,10,'reps','Shoulders down, control return.'],
['Farmer carry','Strength',3,25,'yards','Walk tall and keep trunk braced.'],
['Side plank','Core',3,30,'seconds per side','Hips stacked, body aligned.']]};
const tests=[['10-yard sprint','sec','lower'],['20-yard sprint','sec','lower'],['5-10-5 shuttle','sec','lower'],['Vertical jump','in','higher'],['Broad jump','in','higher'],['Push-ups','reps','higher'],['Body weight','lb','neutral']];
const key='jr-performance-v1';
let db={sessions:{},tests:{},start:'',notes:{}};
try{db={...db,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){}
const save=()=>localStorage.setItem(key,JSON.stringify(db));
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let week=1,day='Monday',tab='dashboard';
const phase=w=>w===4||w===8||w===12?'Recovery / assessment':w<=3?'Foundation':w<=7?'Development':'Strength & power';
function target(w,e){let n=e[2],r=e[3];if(e[1]==='Strength'&&['Barbell back squat','Barbell front squat','Barbell strict press'].includes(e[0])){if(w===4)return [2,8];if(w===8)return [2,6];if(w===12)return [2,5];if(w>=9)return [e[0]==='Barbell strict press'?3:3,e[0]==='Barbell back squat'?5:6];if(w>=5)return [e[0]==='Barbell strict press'?2:3,6]}if([4,8,12].includes(w)&&!['Warm-up'].includes(e[1]))n=Math.max(1,Math.ceil(n*.65));return [n,r]}
const sid=(w,d)=>`${w}-${d}`;
const session=(w,d)=>db.sessions[sid(w,d)]||{};
const allDone=(w,d)=>session(w,d).finished===true;
function navigate(t){tab=t;for(const s of ['dashboard','workouts','progress','library','settings'])$(s).classList.toggle('hidden',s!==t);$('nav').innerHTML=['dashboard','workouts','progress','library','settings'].map((s,i)=>`<button class="${s===t?'active':''}" onclick="navigate('${s}')">${['⌂ Home','▤ Workouts','↗ Progress','☷ Library','⚙ Data'][i]}</button>`).join('');render();scrollTo(0,0)}
function render(){({dashboard:renderDashboard,workouts:renderWorkout,progress:renderProgress,library:renderLibrary,settings:renderSettings})[tab]()}
function suggestedDay(){let n=new Date().getDay();return n===1?'Monday':n===4?'Thursday':n===6?'Saturday':'Monday'}
function exerciseCompletion(w,d){let s=session(w,d),total=0,done=0;exercises[d].forEach(e=>{let n=target(w,e)[0];total+=n;done+=(s.items?.[e[0]]?.sets||[]).slice(0,n).filter(a=>a.done).length});return [done,total]}
function renderDashboard(){let done=Object.values(db.sessions).filter(s=>s.finished).length,pct=Math.round(done/36*100),next=days.find(d=>!allDone(week,d))||suggestedDay();let quote=done===0?'Your first rep starts here.':done<9?'Consistency builds confidence.':done<24?'Keep stacking good sessions.':'Finish strong. You earned it.';
$('dashboard').innerHTML=`<div class="card hero"><span class="eyebrow">YOUR TRAINING HQ</span><h2>${esc(quote)}</h2><p>Week ${week} of 12 · ${phase(week)}</p><div class="progressrow"><div class="bar"><div style="width:${pct}%"></div></div><b>${pct}%</b></div><small>${done} of 36 workouts completed</small><p><button class="big-button" onclick="day='${next}';navigate('workouts')">▶ ${allDone(week,next)?'Review':'Start'} ${next}'s Workout</button></p></div>
<div class="grid"><div class="card"><span class="mini">SESSIONS DONE</span><div class="stat">${done}<span class="mini"> / 36</span></div></div><div class="card"><span class="mini">CURRENT WEEK</span><div class="stat">${week}<span class="mini"> / 12</span></div></div><div class="card"><span class="mini">THIS WEEK</span><div class="stat">${days.filter(d=>allDone(week,d)).length}<span class="mini"> / 3</span></div></div></div>
<div class="card"><div class="section-title"><h2>Training schedule</h2><select aria-label="Select week" onchange="week=+this.value;render()">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${week===i+1?'selected':''}>Week ${i+1}</option>`).join('')}</select></div>${days.map(d=>{let [n,t]=exerciseCompletion(week,d);return `<div class="daycard"><span class="symbol">${d==='Monday'?'⚡':d==='Thursday'?'💪':'🏃'}</span><div><strong>${d}</strong><span class="mini">${d==='Monday'?'Lower body + speed':d==='Thursday'?'Upper body + stability':'Total body + agility'}</span><br><span class="mini">${n}/${t} sets logged</span></div><button class="secondary" onclick="day='${d}';navigate('workouts')">${allDone(week,d)?'Review':'Open'} →</button></div>`}).join('')}</div><div class="card"><h2>⚾ Baseball week</h2><p class="mini">Tue: pitching · Wed: practice · Thu evening: hitting · Sun: practice</p><div class="warn">Keep Thursday lighter before hitting. Reduce workload if tired or sore; stop if any movement hurts.</div></div>`}
function prevInfo(w,d,name){for(let i=w-1;i>=1;i--){let v=session(i,d).items?.[name]?.sets||[];let used=v.filter(x=>x.weight!==''&&x.weight!=null&&x.reps);if(used.length)return `Last: ${used.map(x=>`${x.weight} lb × ${x.reps}`).join(', ')}`}return 'No previous entry'}

// Smart progression is advisory only. It never changes recorded weights.
const primaryLifts=new Set(['Barbell back squat','Barbell front squat','Barbell strict press','Trap bar deadlift','Dumbbell bench press','Dumbbell Romanian deadlift']);
function smartSuggestion(w,d,name){
 if(!primaryLifts.has(name))return null;
 if([4,8,12].includes(w))return {label:'Recovery week',detail:'Keep loads comfortable and follow the reduced set targets.',kind:'hold'};
 let last=null;
 for(let k=w-1;k>=1;k--){let ss=session(k,d),a=ss.items?.[name]?.sets||[];
  let good=a.filter(v=>v.done&&Number(v.weight)>0&&Number(v.reps)>0);
  if(good.length){last={w:k,ss,good,all:a};break}
 }
 if(!last)return {label:'Establish a baseline',detail:'Choose a comfortable weight and leave 2–3 reps in reserve.',kind:'hold'};
 let weight=Math.min(...last.good.map(v=>Number(v.weight))), targetReps=target(last.w,exercises[d].find(e=>e[0]===name))[1];
 let complete=last.good.length>=target(last.w,exercises[d].find(e=>e[0]===name))[0] && last.good.every(v=>Number(v.reps)>=targetReps);
 let form=last.ss.form?.[name]||'',pain=last.ss.pain==='yes',energy=Number(last.ss.energy),sore=Number(last.ss.soreness);
 if(pain)return {label:'Pause progression',detail:'Pain was reported. Do not increase weight; check with a qualified coach or clinician.',kind:'hold'};
 if((energy&&energy<=2)||(sore>=4))return {label:'Recovery first',detail:'Low energy or high soreness last time. Consider a lighter load or fewer sets.',kind:'hold'};
 if(form==='needswork'||!complete)return {label:'Repeat or reduce',detail:`Last logged working weight: ${weight} lb. Focus on smooth technique and completing prescribed reps.`,kind:'hold'};
 if(form!=='good')return {label:'Confirm technique',detail:`Last logged working weight: ${weight} lb. Rate technique as Good before considering an increase.`,kind:'hold'};
 let increment=name.includes('press')||name.includes('bench')?2.5:5;
 return {label:'Optional small increase',detail:`Last working weight: ${weight} lb. If fully recovered, consider ${weight+increment} lb (+${increment} lb), only if suitable plates are available and form stays excellent. Otherwise repeat ${weight} lb.`,kind:'up'};
}
function setForm(name,v){let id=sid(week,day);db.sessions[id]??={};db.sessions[id].form??={};db.sessions[id].form[name]=v;save();render()}
function renderWorkout(){let s=session(week,day),list=exercises[day],[completed,total]=exerciseCompletion(week,day);$('workouts').innerHTML=`<div class="card hero"><div class="row"><label><small>WEEK</small><br><select onchange="week=+this.value;render()">${Array.from({length:12},(_,i)=>`<option ${week===i+1?'selected':''} value="${i+1}">${i+1}</option>`).join('')}</select></label><label><small>WORKOUT DATE</small><br><input type="date" value="${esc(s.date||'')}" onchange="setSession('date',this.value)"></label></div><div class="tabline">${days.map(d=>`<button class="${day===d?'selected':'light-button'}" onclick="day='${d}';render()">${d}</button>`).join('')}</div><span class="eyebrow">${phase(week).toUpperCase()}</span><h2>${day==='Monday'?'Lower Body + Speed':day==='Thursday'?'Upper Body + Stability':'Total Body + Agility'}</h2><div class="progressrow"><div class="bar"><div style="width:${Math.round(completed/total*100)}%"></div></div><b>${completed}/${total} sets</b></div><small>Log weights and reps, then check off each completed set. Changes save automatically on this device.</small><div class="row" style="margin-top:12px"><button class="secondary" onclick="startRest(90)">⏱ 90s rest</button><button class="secondary" onclick="startRest(120)">⏱ 2m rest</button><button class="secondary" onclick="startRest(180)">⏱ 3m rest</button></div></div>
${list.map((e,i)=>{let [n,r]=target(week,e),saved=s.items?.[e[0]]||{},done=(saved.sets||[]).slice(0,n).filter(x=>x.done).length;return `<div class="card exercise-card ${done===n?'done':''}"><div class="exercise-head"><span class="exercise-num">${i+1}</span><div class="exercise-title"><h3>${esc(e[0])}</h3><span class="tag">${e[1]}</span> <small>${n} sets × ${r} ${e[4]}</small></div><span class="badge ${done===n?'':'pending'}">${done}/${n} ✓</span></div><p class="mini">${esc(e[5])}</p><div class="row"><button class="secondary" onclick="demoSearch(${i})">▶ Find demonstration</button><span class="prbadge" id="pr-${i}">${esc(prLabel(e[0]))}</span></div><div class="subtle"><small>${esc(prevInfo(week,day,e[0]))}</small></div>${primaryLifts.has(e[0])?`<div class="smart-box"><b>✨ Smart progression</b><div class="mini">${esc(smartSuggestion(week,day,e[0]).label)} — ${esc(smartSuggestion(week,day,e[0]).detail)}</div><label class="mini">Technique last checked this session: <select onchange="setForm('${e[0]}',this.value)"><option value="">Select</option><option value="good" ${s.form?.[e[0]]==='good'?'selected':''}>Good / controlled</option><option value="needswork" ${s.form?.[e[0]]==='needswork'?'selected':''}>Needs work</option></select></label></div>`:''}<div class="sets"><label>SET</label><label>WEIGHT (LB)</label><label>REPS / RESULT</label><label>DONE</label>${Array.from({length:n},(_,j)=>{let a=saved.sets?.[j]||{};return `<span>${j+1}</span><input aria-label="Set ${j+1} weight for ${esc(e[0])}" type="number" min="0" step="any" placeholder="—" value="${esc(a.weight??'')}" oninput="updateSet(${i},${j},'weight',this.value)"><input aria-label="Set ${j+1} reps for ${esc(e[0])}" type="number" min="0" step="any" placeholder="${r}" value="${esc(a.reps??'')}" oninput="updateSet(${i},${j},'reps',this.value)"><input aria-label="Complete set ${j+1} for ${esc(e[0])}" type="checkbox" ${a.done?'checked':''} onchange="updateSet(${i},${j},'done',this.checked);render()">`}).join('')}</div><button class="secondary" style="width:100%" onclick="fillTargets(${i})">Fill target reps for empty sets</button></div>`}).join('')}
<div class="card"><h2>How did it go?</h2><div class="row"><label>Energy (1–5)<br><select onchange="setSession('energy',this.value)"><option value="">Choose</option>${[1,2,3,4,5].map(v=>`<option ${String(s.energy)===String(v)?'selected':''}>${v}</option>`).join('')}</select></label><label>Soreness (0–5)<br><select onchange="setSession('soreness',this.value)"><option value="">Choose</option>${[0,1,2,3,4,5].map(v=>`<option ${String(s.soreness)===String(v)?'selected':''}>${v}</option>`).join('')}</select></label></div><p><label>Any pain during training? <select onchange="setSession('pain',this.value)"><option value="">Choose</option><option value="no" ${s.pain==='no'?'selected':''}>No</option><option value="yes" ${s.pain==='yes'?'selected':''}>Yes — stop painful exercise</option></select></label></p><p><textarea placeholder="Workout notes, pitching workload, soreness, or wins…" oninput="setSession('note',this.value)">${esc(s.note||'')}</textarea></p><button class="big-button ${s.finished?'secondary':''}" onclick="finish()">${s.finished?'✓ Workout complete — tap to undo':'✓ Finish workout'}</button><p class="mini">You can always come back and edit your sets.</p></div>`}
function fillTargets(i){let e=exercises[day][i],n=target(week,e)[0],r=target(week,e)[1],id=sid(week,day);db.sessions[id]??={};db.sessions[id].items??={};db.sessions[id].items[e[0]]??={sets:[]};for(let j=0;j<n;j++){let a=db.sessions[id].items[e[0]].sets;a[j]??={};if(a[j].reps==null||a[j].reps==='')a[j].reps=r}save();render()}
function setSession(k,v){let id=sid(week,day);db.sessions[id]??={};db.sessions[id][k]=v;save()}
function updateSet(i,j,k,v){let id=sid(week,day),name=exercises[day][i][0];db.sessions[id]??={};db.sessions[id].items??={};db.sessions[id].items[name]??={sets:[]};let a=db.sessions[id].items[name].sets;a[j]??={};a[j][k]=k==='done'?v:v===''?'':Number(v);save();if(k==='done'&&v&&a[j].weight>0&&a[j].reps>0){let best=priorBest(name,week,day,j);if(a[j].weight>best)showToast('🏆 New weight PR: '+name+' — '+a[j].weight+' lb!')}}
function finish(){setSession('finished',!session(week,day).finished);render()}
function renderProgress(){let html=`<div class="card"><h2>Performance testing</h2><p>Enter results in weeks 1, 6, and 12. Lower times are better for sprints; higher distances are better for jumps.</p><div class="scroll"><table><tr><th>Test</th><th>Week 1</th><th>Week 6</th><th>Week 12</th></tr>${tests.map(t=>`<tr><td>${t[0]}<br><small>${t[1]}</small></td>${[1,6,12].map(w=>`<td><input style="width:75px" type="number" step="any" min="0" value="${esc(db.tests[t[0]]?.[w]??'')}" oninput="setTest('${t[0]}',${w},this.value)"></td>`).join('')}</tr>`).join('')}</table></div></div><div class="card"><h2>Strength trends</h2><label>Lift <select id="liftSelect" onchange="drawChart()">${['Barbell back squat','Barbell front squat','Barbell strict press','Trap bar deadlift'].map(x=>`<option>${x}</option>`).join('')}</select></label><canvas id="chart" width="700" height="280"></canvas><small>Chart shows highest logged weight per week for the selected lift.</small></div><div class="card"><h2>Workout completion</h2>${Array.from({length:12},(_,i)=>{let count=days.filter(d=>allDone(i+1,d)).length;return `<div class="row" style="margin:8px 0"><span>Week ${i+1}</span><span>${count}/3</span></div><div class="bar"><div style="width:${count/3*100}%"></div></div>`}).join('')}</div>`;$('progress').innerHTML=html;drawChart()}
function setTest(t,w,v){db.tests[t]??={};db.tests[t][w]=v===''?'':Number(v);save()}
function drawChart(){let c=$('chart');if(!c)return;let x=c.getContext('2d'),name=$('liftSelect').value;let pts=[];for(let w=1;w<=12;w++){let a=days.flatMap(d=>session(w,d).items?.[name]?.sets||[]).map(v=>Number(v.weight)).filter(v=>v>0);pts.push(a.length?Math.max(...a):null)}x.clearRect(0,0,700,280);x.fillStyle='#a8bed8';x.font='17px system-ui';x.fillText('Highest weight (lb)',35,28);x.strokeStyle='#4d657e';x.beginPath();x.moveTo(45,45);x.lineTo(45,230);x.lineTo(670,230);x.stroke();let vals=pts.filter(v=>v!==null),max=Math.max(10,...vals)*1.15;x.strokeStyle='#54d9b5';x.lineWidth=4;x.beginPath();let started=false;pts.forEach((v,i)=>{let px=55+i*54,py=230-(v/max)*170;x.fillStyle='#a7bdd6';x.fillText(i+1,px-4,251);if(v!==null){if(!started){x.moveTo(px,py);started=true}else x.lineTo(px,py)}else started=false});x.stroke();pts.forEach((v,i)=>{if(v!==null){let px=55+i*54,py=230-(v/max)*170;x.beginPath();x.arc(px,py,5,0,7);x.fillStyle='#54d9b5';x.fill();x.fillStyle='#fff';x.font='13px system-ui';x.fillText(v,px-8,py-12)}});if(!vals.length){x.fillStyle='#a8bed8';x.fillText('Log weights in workouts to see your trend.',75,135)}}
function renderLibrary(){let unique=new Map();days.forEach(d=>exercises[d].forEach(e=>unique.set(e[0],e)));$('library').innerHTML=`<div class="card"><h2>Exercise library</h2><p>Coaching cues for every movement in the program. Ask a qualified coach to check technique and supervise loaded lifts.</p></div>${[...unique.values()].map(e=>`<details class="card"><summary><b>${esc(e[0])}</b> <span class="tag">${e[1]}</span></summary><p>${esc(e[5])}</p><small>Base prescription: ${e[2]} sets × ${e[3]} ${e[4]}; follow weekly targets in the workout tab.</small><p><button class="secondary" onclick="openDemoName('${e[0].replace("'", "\\'")}')">▶ Search demonstration videos</button></p></details>`).join('')}`}
function renderSettings(){$('settings').innerHTML=`<div class="card"><h2>Backup & restore</h2><p>Workout data is saved only in this browser on this device. Clearing browser data or changing phones may erase it. Export a backup regularly.</p><div class="row"><button onclick="exportJSON()">Export backup (.json)</button><button class="secondary" onclick="exportCSV()">Export sets (.csv)</button></div><p><label>Restore backup <input type="file" accept=".json,application/json" onchange="importJSON(event)"></label></p></div><div class="card"><h2>Program schedule</h2><p>Monday gym • Tuesday pitching • Wednesday practice • Thursday gym before evening hitting • Friday recovery • Saturday gym • Sunday practice.</p><p class="warn">For a developing athlete: maintain technique, avoid max testing, keep 2–3 reps in reserve, and adjust volume for throwing workload. Stop for pain and consult an appropriate clinician for persistent symptoms.</p></div><div class="card"><h2>Reset</h2><p>Only use this if you want to delete all saved workout history on this device.</p><button class="danger" onclick="if(confirm('Delete ALL saved data? This cannot be undone.')){localStorage.removeItem(key);location.reload()}">Erase all data</button></div>`}
function exportJSON(){download('JR_Performance_Backup.json',JSON.stringify(db,null,2),'application/json')}
function exportCSV(){let lines=[['Week','Day','Exercise','Set','Weight lb','Reps/result','Completed','Workout complete','Date']];for(let w=1;w<=12;w++)for(let d of days){let s=session(w,d);for(let e of exercises[d]){let sets=s.items?.[e[0]]?.sets||[];sets.forEach((v,i)=>lines.push([w,d,e[0],i+1,v.weight??'',v.reps??'',v.done?'Yes':'No',s.finished?'Yes':'No',s.date||'']))}}download('JR_Performance_Workout_Log.csv',lines.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
function download(name,data,type){let url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
async function importJSON(ev){let f=ev.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x.sessions||!x.tests)throw Error('Not a JR backup');if(confirm('Replace current data with this backup?')){db=x;save();render();alert('Backup restored')}}catch(e){alert('Could not restore: '+e.message)}}
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});

// Version 3 additions: local rest timer, video discovery, and personal-record recognition.
let restRemaining=0,restInterval=null;
function renderRest(){const dock=$('restDock');if(restRemaining<=0){dock.classList.add('hidden');return;}dock.classList.remove('hidden');const m=Math.floor(restRemaining/60),sec=String(restRemaining%60).padStart(2,'0');dock.innerHTML=`<div class="row"><span>REST TIMER</span><button class="secondary" onclick="stopRest()" aria-label="Dismiss timer">✕</button></div><strong>${m}:${sec}</strong><div><button class="secondary" onclick="restRemaining+=30;renderRest()">+30s</button><button class="secondary" onclick="stopRest()">Done</button></div>`}
function startRest(seconds){clearInterval(restInterval);restRemaining=seconds;renderRest();restInterval=setInterval(()=>{restRemaining--;renderRest();if(restRemaining<=0){clearInterval(restInterval);showToast('⏱ Rest complete — ready for the next set!');if(navigator.vibrate)navigator.vibrate([180,100,180])}},1000)}
function stopRest(){clearInterval(restInterval);restRemaining=0;renderRest()}
function showToast(msg){const el=$('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),3500)}
function priorBest(name,w,d,setIndex){let best=0;for(let i=1;i<=12;i++)for(let dayName of days){if(i>w)continue;const sets=session(i,dayName).items?.[name]?.sets||[];for(let [idx,a] of sets.entries()){if(i===w&&dayName===d&&idx===setIndex)continue;if(a.done&&Number(a.weight)>best&&Number(a.reps)>0)best=Number(a.weight)}}return best}
function prLabel(name){let best=0;for(let i=1;i<=12;i++)for(let d of days){const sets=session(i,d).items?.[name]?.sets||[];for(let a of sets){if(a.done&&Number(a.weight)>best&&Number(a.reps)>0)best=Number(a.weight)}}return best?'🏆 PR '+best+' lb':'PR: not yet logged'}
function openDemoName(name){const q=encodeURIComponent(name+' exercise proper form coaching demonstration');window.open('https://www.youtube.com/results?search_query='+q,'_blank','noopener,noreferrer')}
function demoSearch(i){openDemoName(exercises[day][i][0])}

navigate('dashboard');
</script></body></html>
